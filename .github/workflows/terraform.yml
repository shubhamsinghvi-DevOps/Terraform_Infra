name: "Infra-Pipeline"
on:  workflow_dispatch

permissions:
  id-token: write
  contents: read 
  
jobs:
  terraform-job:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
        with:
          version: 1.13.0
      
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 29348289-19bc-46dc-a8f8-7da7dbc6f77c
          tenant-id: 14595b8b-b1ba-4274-8a30-b513dff9d2a7
          subscription-id: 6b38de24-6577-4220-8a9e-3ddcaa335ffc
          
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true
        working-directory: Environment/test
        
      - name: Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: Environment/test

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: Environment/test

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true
        working-directory: Environment/test
                
      
    
